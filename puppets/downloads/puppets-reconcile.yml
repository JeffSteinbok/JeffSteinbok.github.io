name: Puppets Reconcile

# Reusable lifecycle engine. A controller workflow supplies the owner, repository troupe,
# approval actors, schedule, token, and any deployment-specific notification behavior.

on:
  workflow_call:
    inputs:
      owner:
        description: 'GitHub owner containing the managed repositories'
        required: true
        type: string
      repositories:
        description: 'Managed repository names, one per line'
        required: true
        type: string
      approval_actors:
        description: 'GitHub logins allowed to approve work, one per line'
        required: true
        type: string
      dry_run:
        description: 'Report transitions without changing issues'
        required: false
        default: false
        type: boolean
      max_issues_per_repo:
        description: 'Maximum approved issues to assign per repository'
        required: false
        default: '1'
        type: string
      conflict_retries:
        description: 'Copilot conflict-resolution attempts before escalating to needs-human'
        required: false
        default: '2'
        type: string
      enable_curation:
        description: 'Run the M2 curation pass (GitHub Models dedupe + auto-label) before assigning Copilot'
        required: false
        default: true
        type: boolean
      inbox_workflow_id:
        description: 'Controller workflow filename used to determine the previous run'
        required: false
        default: 'puppets-lifecycle.yml'
        type: string
      puppets_stale_hours:
        description: 'Hours after which an un-triaged issue is re-surfaced as stale'
        required: false
        default: '72'
        type: string
    secrets:
      token:
        description: 'Fine-grained PAT with access to the managed repositories'
        required: true
    outputs:
      waiting_count:
        description: 'Number of issues needing attention'
        value: ${{ jobs.reconcile.outputs.waiting_count }}
      waiting_message:
        description: 'Markdown digest of issues needing attention'
        value: ${{ jobs.reconcile.outputs.waiting_message }}

permissions:
  contents: read
  models: read

jobs:
  bootstrap-labels:
    uses: ./.github/workflows/puppets-bootstrap-labels.yml
    with:
      owner: ${{ inputs.owner }}
      repositories: ${{ inputs.repositories }}
      dry_run: ${{ inputs.dry_run }}
    secrets:
      token: ${{ secrets.token }}

  reconcile:
    needs: bootstrap-labels
    runs-on: ubuntu-latest
    outputs:
      waiting_count: ${{ steps.reconcile.outputs.waiting_count }}
      waiting_message: ${{ steps.reconcile.outputs.waiting_message }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconcile issue lifecycle
        id: reconcile
        uses: actions/github-script@v9
        env:
          PUPPETS_OWNER: ${{ inputs.owner }}
          PUPPETS_REPOSITORIES: ${{ inputs.repositories }}
          PUPPETS_APPROVAL_ACTORS: ${{ inputs.approval_actors }}
          PUPPETS_INBOX_WORKFLOW_ID: ${{ inputs.inbox_workflow_id }}
          DRY_RUN: ${{ inputs.dry_run }}
          MAX_ISSUES_PER_REPO: ${{ inputs.max_issues_per_repo }}
          CONFLICT_RETRIES: ${{ inputs.conflict_retries }}
          ENABLE_CURATION: ${{ inputs.enable_curation }}
          INBOX_FALLBACK_HOURS: '24'
          PUPPETS_STALE_HOURS: ${{ inputs.puppets_stale_hours }}
        with:
          github-token: ${{ secrets.token }}
          script: |
            const reconcile = require('./.github/scripts/puppets-reconcile.js');
            await reconcile({ github, context, core });
