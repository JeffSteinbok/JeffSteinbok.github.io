name: Puppets Lifecycle

# Edit this configuration, save all three Puppets workflow files under
# .github/workflows/, and add a PUPPETS_TOKEN Actions secret. If you rename this file,
# update inbox_workflow_id below to the new filename.

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report transitions without changing issues'
        required: false
        default: false
        type: boolean
      max_issues_per_repo:
        description: 'Maximum approved issues to assign per repository'
        required: false
        default: '1'
        type: string
      conflict_retries:
        description: 'Conflict-resolution attempts before escalating to needs-human'
        required: false
        default: '2'
        type: string

permissions:
  contents: read

jobs:
  reconcile:
    uses: ./.github/workflows/puppets-reconcile.yml
    with:
      owner: 'YOUR_GITHUB_OWNER'
      repositories: |
        repository-one
        repository-two
      approval_actors: |
        YOUR_GITHUB_LOGIN
      dry_run: ${{ inputs.dry_run || false }}
      max_issues_per_repo: ${{ inputs.max_issues_per_repo || '1' }}
      conflict_retries: ${{ inputs.conflict_retries || '2' }}
      inbox_workflow_id: 'puppets-controller.yml'
    secrets:
      token: ${{ secrets.PUPPETS_TOKEN }}
