name: Puppets Bootstrap Labels

# Idempotently create/update the puppets:* lifecycle label set (plus a few helper
# labels) across every repo participating in the Puppets lifecycle. Safe to re-run:
# existing labels have their color/description reconciled, missing ones are created.
#
# Child repos stay ignorant of Puppets logic (Mechanism B, central reconciler) — this
# only ensures the shared label vocabulary exists so the reconciler can drive state.

on:
  workflow_call:
    inputs:
      owner:
        description: 'GitHub owner containing the managed repositories'
        required: true
        type: string
      repositories:
        description: 'Managed repository names, one per line'
        required: true
        type: string
      dry_run:
        description: 'Dry run - list label changes, do not apply'
        required: false
        default: false
        type: boolean
    secrets:
      token:
        description: 'Fine-grained PAT with access to the managed repositories'
        required: true
  workflow_dispatch:
    inputs:
      owner:
        description: 'GitHub owner containing the managed repositories'
        required: true
        type: string
      repositories:
        description: 'Managed repository names, one per line'
        required: true
        type: string
      dry_run:
        description: 'Dry run - list label changes, do not apply'
        required: false
        default: false
        type: boolean

jobs:
  bootstrap-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Upsert puppets label set
        uses: actions/github-script@v9
        env:
          PUPPETS_OWNER: ${{ inputs.owner }}
          PUPPETS_REPOSITORIES: ${{ inputs.repositories }}
        with:
          github-token: ${{ secrets.token || secrets.PUPPETS_TOKEN }}
          script: |
            const owner = process.env.PUPPETS_OWNER.trim();
            const dryRun = '${{ inputs.dry_run }}' === 'true';
            const repos = process.env.PUPPETS_REPOSITORIES
              .trim().split('\n').map(r => r.trim()).filter(Boolean);

            if (!owner || repos.length === 0) {
              throw new Error('owner and repositories must not be empty');
            }

            // Canonical label set. Colors are hex without '#'.
            const LABELS = [
              // --- puppets:* lifecycle (one active at a time) ---
              { name: 'puppets:needs-info',        color: 'D4C5F9', description: 'Missing repro/logs/version; author must edit before triage completes.' },
              { name: 'puppets:approved',          color: '0E8A16', description: 'HUMAN GATE: approved to work. Only an allowlisted write/triage user may add this.' },
              { name: 'puppets:curating',          color: '1D76DB', description: 'Agentic curation (dedupe/abuse/feasibility) in progress. No commit.' },
              { name: 'puppets:ready',             color: '5319E7', description: 'Cleared curation screens; queued for implementation.' },
              { name: 'puppets:needs-human',       color: 'B60205', description: 'Genuine human decision needed (abuse suspicion / breaking / product).' },
              { name: 'puppets:claimed',           color: 'C2E0C6', description: 'Lease marker: an implementation pass has claimed this item.' },
              { name: 'puppets:needs-work',        color: 'E99695', description: 'Reviewer/CI flagged the PR; loops back to remediation.' },
              { name: 'puppets:in-review',         color: '006B75', description: 'PR open and tracked through review and merge.' },
              { name: 'puppets:done',              color: '6A737D', description: 'PR merged, issue closed. Terminal.' },
              { name: 'puppets:no-auto',           color: '000000', description: 'Hard opt-out: Puppets automation must never touch this item.' },
              // --- helper labels ---
              { name: 'type:bug',                  color: 'D73A4A', description: 'Something is broken.' },
              { name: 'type:feature',              color: 'A2EEEF', description: 'New capability.' },
              { name: 'type:chore',                color: 'CFD3D7', description: 'Maintenance / housekeeping.' },
              { name: 'stale',                     color: 'EDEDED', description: 'No activity for N days; candidate for closure.' },
              { name: 'tracking',                  color: '0052CC', description: 'Parent/epic tracking split-out children.' },
            ];

            let created = 0, updated = 0, unchanged = 0;

            for (const repo of repos) {
              console.log(`\n📦 ${owner}/${repo}`);
              // Fetch existing labels once.
              const existing = new Map();
              try {
                const all = await github.paginate(github.rest.issues.listLabelsForRepo, {
                  owner, repo, per_page: 100,
                });
                for (const l of all) existing.set(l.name, l);
              } catch (e) {
                throw new Error(`Could not list labels for ${owner}/${repo}: ${e.message}`);
              }

              for (const spec of LABELS) {
                const cur = existing.get(spec.name);
                if (!cur) {
                  console.log(`  ＋ create ${spec.name}`);
                  if (!dryRun) {
                    await github.rest.issues.createLabel({ owner, repo, name: spec.name, color: spec.color, description: spec.description });
                  }
                  created++;
                } else if (cur.color.toLowerCase() !== spec.color.toLowerCase() || (cur.description || '') !== spec.description) {
                  console.log(`  ✎ update ${spec.name}`);
                  if (!dryRun) {
                    await github.rest.issues.updateLabel({ owner, repo, name: spec.name, color: spec.color, description: spec.description });
                  }
                  updated++;
                } else {
                  unchanged++;
                }
              }
            }

            console.log(`\n${'='.repeat(40)}`);
            console.log(`${dryRun ? '[dry-run] ' : ''}created=${created} updated=${updated} unchanged=${unchanged}`);
