<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title | default: site.title }}</title>
  <link rel="icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
  <script>
    // Set theme before first paint to avoid a flash. Saved choice wins; else system.
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body{% if page.url != '/' %} class="has-header"{% endif %}>
  {% if page.url == '/' %}
    <div class="theme-toggle-float">{% include theme-toggle.html %}</div>
  {% else %}
    {% include site-header.html %}
  {% endif %}
  {{ content }}
  <script>
    // Toggle + persist. Runs after the button exists in the DOM.
    (function () {
      var root = document.documentElement;
      document.querySelectorAll('.theme-toggle').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
          root.setAttribute('data-theme', next);
          try { localStorage.setItem('theme', next); } catch (e) {}
          if (window.__mermaidRetheme) window.__mermaidRetheme(next);
        });
      });
    })();
  </script>
  <script>
    // Add a copy button to each code block inside prose (.doc), skipping diagrams.
    (function () {
      document.querySelectorAll('.doc pre').forEach(function (pre) {
        if (pre.classList.contains('mermaid')) return;
        pre.classList.add('has-copy');
        var btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.type = 'button';
        btn.textContent = 'Copy';
        btn.addEventListener('click', function () {
          var code = pre.querySelector('code') || pre;
          navigator.clipboard.writeText(code.innerText.replace(/\n$/, '')).then(function () {
            btn.textContent = 'Copied';
            setTimeout(function () { btn.textContent = 'Copy'; }, 1500);
          });
        });
        pre.appendChild(btn);
      });
    })();
  </script>
  {% if page.mermaid %}
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
    // kramdown renders ```mermaid fences as <pre><code class="language-mermaid">.
    // Rewrite them into <pre class="mermaid"> nodes, preserving the source.
    document.querySelectorAll("pre > code.language-mermaid").forEach((code) => {
      const pre = code.parentElement;
      const graph = document.createElement("pre");
      graph.className = "mermaid";
      const src = code.textContent;
      graph.textContent = src;
      graph.dataset.src = src; // original definition, for re-rendering on theme change
      pre.replaceWith(graph);
    });
    const themeFor = (t) => (t === "light" ? "default" : "dark");
    // Render explicitly (startOnLoad is unreliable from a deferred module) and
    // reuse the same path when the user flips the theme.
    const renderMermaid = (t) => {
      document.querySelectorAll("pre.mermaid").forEach((el) => {
        if (el.dataset.src === undefined) return;
        el.removeAttribute("data-processed");
        el.textContent = el.dataset.src;
      });
      mermaid.initialize({ startOnLoad: false, theme: themeFor(t) });
      return mermaid.run({ querySelector: "pre.mermaid" });
    };
    renderMermaid(document.documentElement.getAttribute("data-theme"));
    window.__mermaidRetheme = renderMermaid;
  </script>
  {% endif %}
</body>
</html>
