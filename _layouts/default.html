<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title | default: site.title }}</title>
  <link rel="icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
</head>
<body>
  {{ content }}
  {% if page.mermaid %}
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
    // kramdown renders ```mermaid fences as <pre><code class="language-mermaid">.
    // Rewrite them into <pre class="mermaid"> nodes Mermaid can pick up.
    document.querySelectorAll("pre > code.language-mermaid").forEach((code) => {
      const pre = code.parentElement;
      const graph = document.createElement("pre");
      graph.className = "mermaid";
      graph.textContent = code.textContent;
      pre.replaceWith(graph);
    });
    mermaid.initialize({ startOnLoad: true, theme: "dark" });
  </script>
  {% endif %}
</body>
</html>
