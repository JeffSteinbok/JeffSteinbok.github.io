<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" role="img" aria-label="Puppets logo">
  <!-- marionette control bar (the human holds the strings = the gates) -->
  <g stroke="#58a6ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <line x1="30" y1="20" x2="90" y2="20" />
    <line x1="60" y1="11" x2="60" y2="29" />
  </g>

  <!-- strings from the bar down to the work item -->
  <g stroke="#8b949e" stroke-width="2" stroke-linecap="round">
    <line x1="34" y1="22" x2="45" y2="64" />
    <line x1="60" y1="30" x2="60" y2="60" />
    <line x1="86" y1="22" x2="75" y2="64" />
  </g>

  <!-- the work item (issue → PR) node -->
  <rect x="38" y="62" width="44" height="40" rx="9"
        fill="#161b22" stroke="#58a6ff" stroke-width="4" />

  <!-- approved / merged check -->
  <path d="M49 82 l7 7 l14 -15"
        fill="none" stroke="#3fb950" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round" />

  <!-- string attach points -->
  <g fill="#e6edf3">
    <circle cx="45" cy="64" r="2.6" />
    <circle cx="60" cy="60" r="2.6" />
    <circle cx="75" cy="64" r="2.6" />
  </g>
</svg>
