{%- comment -%} Single project card, driven by a _data/projects.yml entry. {%- endcomment -%}
<a class="card" href="{{ include.card.url }}"{% if include.card.external %} target="_blank" rel="noopener noreferrer"{% endif %}>
  <div class="card-icon">{% if include.card.icon_img %}<img src="{{ include.card.icon_img | relative_url }}" alt="{{ include.card.title }} logo" />{% else %}{{ include.card.icon_emoji }}{% endif %}</div>
  <div class="card-title">{{ include.card.title }}</div>
  <div class="card-desc">{{ include.card.desc }}</div>
  <div class="card-arrow">{{ include.card.arrow }}</div>
</a>
